<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Everlost · 3D návrhy postavy</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;color:#eee9dc;background:#101419}*{box-sizing:border-box}body{margin:0;overflow:hidden}canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}header{position:absolute;left:32px;right:32px;top:25px;display:flex;justify-content:space-between;gap:20px;align-items:center;pointer-events:none}h1{font:500 22px Georgia,serif;letter-spacing:.02em;margin:0}.eyebrow{font-size:10px;letter-spacing:.22em;color:#a2a394;margin-bottom:8px}nav,.actions{display:flex;gap:8px;pointer-events:auto}button,a{font:inherit}button,.actions a,nav a{border:1px solid #ffffff20;border-radius:9px;background:#1d242bdd;color:#ddd9cc;padding:10px 15px;cursor:pointer;text-decoration:none;font-size:12px;backdrop-filter:blur(15px)}button:hover,a:hover{border-color:#cdbb86;background:#2b322f}button.active{border-color:#cdbb86;color:#f4e0a5}.help{position:absolute;top:93px;left:32px;font-size:11px;color:#9ca7ad;pointer-events:none}.bottom{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:min(850px,calc(100vw - 48px));display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:17px 18px;text-align:left;border-radius:13px;min-height:91px;background:#1b2229e8;box-shadow:0 8px 30px #0002}.card strong{font:500 19px Georgia,serif;display:block;margin-bottom:8px}.card span{font-size:11px;color:#a9b2b5;line-height:1.4}.letter{display:inline-grid;place-items:center;width:21px;height:21px;background:#ffffff0a;border:1px solid #ffffff20;border-radius:5px;margin-right:8px;font:11px system-ui!important}.card.active{border-color:#cdbb86;background:#29312de8}.card.active span{color:#c3c8bb}.actions{position:absolute;bottom:134px;left:50%;transform:translateX(-50%)}.status{position:absolute;inset:0;display:grid;place-items:center;background:#101419e8;color:#c9cfca;font-size:14px;pointer-events:none}.status.hide{display:none}.hint{position:absolute;right:32px;top:94px;color:#929b9f;font-size:10px}.error{color:#edb2a0;white-space:pre-line;padding:30px;text-align:center} @media(max-width:760px){header{left:17px;right:17px;top:18px}h1{font-size:18px}nav{gap:5px}nav button,nav a{padding:8px;font-size:10px}.help{left:17px;top:91px;max-width:70vw;font-size:10px}.hint{display:none}.bottom{bottom:14px;width:calc(100vw - 24px);gap:7px}.card{padding:12px 10px;min-height:120px}.card strong{font-size:16px}.card span{font-size:10px}.actions{bottom:147px;white-space:nowrap}.actions a{font-size:10px;padding:8px}}
</style></head><body>
<canvas id="view" aria-label="Otočná 3D prohlídka tří návrhů postavy"></canvas>
<header><div><div class="eyebrow">EVERLOST · SKUTEČNÉ 3D MODELY</div><h1>Návrhy výchozí postavy</h1></div><nav><button id="all">Vedle sebe</button><button id="reset">Obnovit pohled</button><a href="Everlost_Character_Proposals.blend" download>Blender scéna ↗</a></nav></header>
<div class="help">Táhni pro otáčení · Kolečko pro přiblížení · Shift + tažení pro posun</div><div class="hint">Klávesy 1 / 2 / 3 · 4 pro všechny</div>
<div class="actions"><button id="front">Zepředu</button><button id="back">Zezadu</button><a id="glb" href="A.glb" download>Stáhnout GLB ↓</a><a id="fbx" href="A.fbx" download>Stáhnout FBX ↓</a></div>
<div class="bottom" id="choices"></div><div class="status" id="status">Načítám skutečné 3D modely…</div>
<script>
'use strict';
const canvas=document.getElementById('view'),gl=canvas.getContext('webgl2',{antialias:true,alpha:false,preserveDrawingBuffer:true});
const status=document.getElementById('status');let models=[],selected=0,all=false,yaw=.30,pitch=.12,distance=4.25,panX=0,panZ=0,width=1,height=1,viewportH=1;
function fail(e){status.className='status error';status.textContent='Prohlídku se nepodařilo otevřít.\n'+e.message+'\nModely jsou také v přiložené Blender scéně.';console.error(e)}
function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const vs=`#version 300 es
precision highp float;
layout(location=0) in vec3 position;layout(location=1) in vec3 normal;layout(location=2) in vec2 uv;
uniform mat4 projectionView;uniform vec3 offset;
out vec3 world;out vec3 N;out vec2 UV;
void main(){world=position+offset;N=normal;UV=uv;gl_Position=projectionView*vec4(world,1.);}`;
const fs=`#version 300 es
precision highp float;
in vec3 world;in vec3 N;in vec2 UV;out vec4 frag;
uniform sampler2D colourMap;uniform sampler2D normalMap;uniform vec3 eye;uniform bool floorPass;uniform bool lineUp;
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
void main(){
 vec3 n=normalize(N);if(!gl_FrontFacing)n=-n;vec3 base;
 if(floorPass){base=vec3(.11,.125,.13);float ao=0.;for(int i=0;i<3;i++){float x=lineUp?float(i-1)*1.7:0.;if(!lineUp&&i>0)continue;vec2 p=world.xy-vec2(x,-.04);ao+=.46*exp(-dot(p*vec2(1.7,2.1),p*vec2(1.7,2.1))*3.5);}base*=1.-min(.65,ao);}
 else{base=pow(texture(colourMap,UV).rgb,vec3(2.2));vec3 dp1=dFdx(world),dp2=dFdy(world);vec2 du1=dFdx(UV),du2=dFdy(UV);vec3 t=dp1*du2.y-dp2*du1.y;vec3 b=-dp1*du2.x+dp2*du1.x;float tl=length(t),bl=length(b);if(tl>1e-7&&bl>1e-7){vec3 map=texture(normalMap,UV).rgb*2.-1.;vec3 pert=normalize(mat3(t/tl,b/bl,n)*map);n=normalize(mix(n,pert,.5));}}
 vec3 light=normalize(vec3(-.6,-.8,1.35)),fill=normalize(vec3(.9,.2,.65)),back=normalize(vec3(0.,1.,.8));
 vec3 lighting=vec3(.30,.33,.37)+vec3(1.05,.92,.76)*max(0.,dot(n,light))+vec3(.26,.34,.43)*max(0.,dot(n,fill))+vec3(.18,.19,.22)*max(0.,dot(n,back));
 vec3 v=normalize(eye-world),h=normalize(v+light);float spec=pow(max(dot(n,h),0.),32.)*.035;
 vec3 col=base*lighting+spec;float fog=1.-exp(-length(world-eye)*.005);col=mix(col,vec3(.045,.054,.064),fog);
 frag=vec4(pow(aces(col),vec3(1./2.2)),1.);
}`;
let program,pvLoc,eyeLoc,offsetLoc,floorLoc,lineUpLoc,floorVao;
function setup(){if(!gl)throw Error('Prohlížeč nepodporuje WebGL 2.');program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vs));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);pvLoc=gl.getUniformLocation(program,'projectionView');eyeLoc=gl.getUniformLocation(program,'eye');offsetLoc=gl.getUniformLocation(program,'offset');floorLoc=gl.getUniformLocation(program,'floorPass');lineUpLoc=gl.getUniformLocation(program,'lineUp');gl.uniform1i(gl.getUniformLocation(program,'colourMap'),0);gl.uniform1i(gl.getUniformLocation(program,'normalMap'),1);gl.enable(gl.DEPTH_TEST);gl.clearColor(.047,.058,.071,1);floorVao=geometry(new Float32Array([-30,-30,-.012,0,0,1,0,0,30,-30,-.012,0,0,1,1,0,30,30,-.012,0,0,1,1,1,-30,-30,-.012,0,0,1,0,0,30,30,-.012,0,0,1,1,1,-30,30,-.012,0,0,1,0,1]));}
function geometry(data){const vao=gl.createVertexArray();gl.bindVertexArray(vao);const buffer=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buffer);gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);for(const [i,n,o] of [[0,3,0],[1,3,12],[2,2,24]]){gl.enableVertexAttribArray(i);gl.vertexAttribPointer(i,n,gl.FLOAT,false,32,o)}gl.bindVertexArray(null);return vao}
async function texture(url){const im=new Image();im.src=url;await im.decode();const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.generateMipmap(gl.TEXTURE_2D);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t}
function choose(index,group=false){selected=index;all=group;distance=all?8.25:4.25;yaw=.30;pitch=.12;panX=0;panZ=0;document.querySelectorAll('.card').forEach((b,i)=>b.classList.toggle('active',!all&&i===selected));document.getElementById('all').classList.toggle('active',all);for(const ext of ['glb','fbx']){const a=document.getElementById(ext);a.href=models[index].id+'.'+ext;a.style.display=all?'none':''}document.title=all?'Everlost · Porovnání 3D postav':'Everlost · '+models[index].title}
function perspective(fov,aspect,near,far){const f=1/Math.tan(fov/2),nf=1/(near-far);return new Float32Array([f/aspect,0,0,0,0,f,0,0,0,0,(far+near)*nf,-1,0,0,2*far*near*nf,0])}
function sub(a,b){return a.map((v,i)=>v-b[i])}function norm(a){const l=Math.hypot(...a);return a.map(x=>x/l)}function cross(a,b){return[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]]}function dot(a,b){return a.reduce((s,x,i)=>s+x*b[i],0)}
function look(eye,target){const z=norm(sub(eye,target)),x=norm(cross([0,0,1],z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,eye),-dot(y,eye),-dot(z,eye),1])}
function multiply(a,b){const r=new Float32Array(16);for(let col=0;col<4;col++)for(let row=0;row<4;row++)for(let i=0;i<4;i++)r[col*4+row]+=a[i*4+row]*b[col*4+i];return r}
function resize(){const d=Math.min(devicePixelRatio||1,2);width=Math.round(innerWidth*d);height=Math.round(innerHeight*d);if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height}const bottom=(innerWidth<760?185:133)*d,top=100*d;viewportH=Math.max(1,height-bottom-top);gl.viewport(0,Math.round(bottom),width,Math.round(viewportH))}
function draw(){resize();gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);const target=[panX,0,1.02+panZ],eye=[target[0]+Math.sin(yaw)*Math.cos(pitch)*distance,-Math.cos(yaw)*Math.cos(pitch)*distance,target[2]+Math.sin(pitch)*distance];gl.uniformMatrix4fv(pvLoc,false,multiply(perspective(.59,width/viewportH,.025,100),look(eye,target)));gl.uniform3fv(eyeLoc,eye);gl.uniform1i(lineUpLoc,all);gl.uniform1i(floorLoc,true);gl.uniform3f(offsetLoc,0,0,0);gl.bindVertexArray(floorVao);gl.drawArrays(gl.TRIANGLES,0,6);gl.uniform1i(floorLoc,false);models.forEach((m,i)=>{if(!all&&i!==selected)return;gl.uniform3f(offsetLoc,all?(i-1)*1.7:0,0,0);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,m.colourTexture);gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,m.normalTexture);gl.bindVertexArray(m.vao);gl.drawArrays(gl.TRIANGLES,0,m.vertices)});requestAnimationFrame(draw)}
let drag=null;canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag={x:e.clientX,y:e.clientY};if(e.shiftKey){panX-=dx*.0012*distance;panZ+=dy*.0012*distance}else{yaw-=dx*.008;pitch=Math.max(-.45,Math.min(1.15,pitch+dy*.006))}});canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(.85,Math.min(13,distance*Math.exp(e.deltaY*.001)))},{passive:false});canvas.addEventListener('dblclick',()=>choose(selected,all));document.getElementById('all').onclick=()=>choose(selected,true);document.getElementById('reset').onclick=()=>choose(selected,all);document.getElementById('front').onclick=()=>{yaw=0;pitch=.04};document.getElementById('back').onclick=()=>{yaw=Math.PI;pitch=.04};window.addEventListener('keydown',e=>{if(['1','2','3'].includes(e.key))choose(+e.key-1);if(e.key==='4')choose(selected,true)});
(async()=>{setup();const response=await fetch('models.json');if(!response.ok)throw Error('Modely ještě nejsou k dispozici.');models=await response.json();for(let i=0;i<models.length;i++){const m=models[i];status.textContent='Načítám model '+m.id+' · '+m.title+'…';const res=await fetch(m.file);if(!res.ok)throw Error(m.file);const data=new Float32Array(await res.arrayBuffer());if(data.length!==m.vertices*8)throw Error('Neúplná geometrie '+m.id);m.vao=geometry(data);[m.colourTexture,m.normalTexture]=await Promise.all([texture(m.color),texture(m.normal)]);const b=document.createElement('button');b.className='card';const title=document.createElement('strong'),letter=document.createElement('b'),text=document.createElement('span');letter.className='letter';letter.textContent=m.id;title.append(letter,document.createTextNode(m.title));text.textContent=m.description;b.append(title,text);b.onclick=()=>choose(i);document.getElementById('choices').append(b)}choose(0,true);status.classList.add('hide');draw();window.viewerReady=true;window.selectCharacter=choose})().catch(fail);
</script></body></html>
